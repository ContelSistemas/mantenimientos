services:
  # Modo "prod-like" local: mismo contenedor Nginx pero expuesto por un puerto local
  buscador:
    # publica el Nginx interno (80) en tu máquina
    ports:
      - "8080:80"
    # desactiva Traefik por si lo estás ejecutando localmente
    labels:
      - "traefik.enable=false"
    # asegura que la red exista también en local
    networks:
      - traefik-public

  # Modo desarrollo con hot-reload (Vite)
  buscador-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      # volumen anónimo para node_modules dentro del contenedor
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

networks:
  # Crea una red bridge local con el mismo nombre lógico que en producción
  traefik-public:
    driver: bridge
    external: false
