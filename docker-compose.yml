services:

  # ── App: Buscador Contel (Frontend Nginx + Proxy) ──────────────────
  buscador:
    build: .
    container_name: contel-buscador
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - traefik_default
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # Router HTTPS
      - "traefik.http.routers.contel-buscador.rule=Host(`mantenimientos.domdoklab.me`)"
      - "traefik.http.routers.contel-buscador.entrypoints=websecure"
      - "traefik.http.routers.contel-buscador.tls=true"
      - "traefik.http.routers.contel-buscador.tls.certresolver=letsencrypt"
      # Servicio interno (Nginx escucha en puerto 80 dentro del contenedor)
      - "traefik.http.services.contel-buscador.loadbalancer.server.port=80"
      # Redirección automática HTTP → HTTPS
      - "traefik.http.routers.contel-buscador-http.rule=Host(`mantenimientos.domdoklab.me`)"
      - "traefik.http.routers.contel-buscador-http.entrypoints=web"
      - "traefik.http.routers.contel-buscador-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  # ── API: Backend Node.js (Express + SQLite) ────────────────────────
  api:
    build: ./server
    container_name: contel-api
    restart: unless-stopped
    volumes:
      # Persistencia fuera del repo (evita perder datos/PDFs al redeplegar)
      # OJO: el backend corre desde `/app/src/index.js`, así que sus rutas reales son:
      # - DB:      `/app/data/contel.db`
      # - Uploads: `/app/uploads`
      - /var/lib/contel-buscador/data:/app/data
      - /var/lib/contel-buscador/uploads:/app/uploads
    networks:
      - internal
    environment:
      - PORT=3000
      - DB_PATH=/app/data/contel.db

networks:
  # Red externa para conexión con el proxy Traefik
  traefik_default:
    external: true
  # Red interna aislada para comunicación entre servicios
  internal:
    driver: bridge
